name: نشر اللعبة على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# الدفع إلى فرع gh-pages يحتاج الكتابة على المحتوى وحده.
# لا صلاحيات pages/id-token هنا: مسار actions/deploy-pages يستدعي
# واجهة Pages لإنشاء الموقع، ورمزُ سير العمل لا يملكها في هذا
# المستودع — «Resource not accessible by integration». وفرعُ
# gh-pages في مستودع عام يُفعّل Pages من تلقائه بلا تلك الواجهة.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ci لا install: يلتزم بـpackage-lock.json حرفياً
      - run: npm ci

      # فحص المحتوى قبل البناء — صور مفقودة ومراجع مكسورة ومجالات أرقام معكوسة
      - run: npm run validate
      - run: npm run lint
      - run: npm run build

      - name: دفع dist إلى فرع gh-pages
        run: |
          set -e
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "نشر ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
